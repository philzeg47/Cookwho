name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule un run précédent encore en cours sur la même réf (économise des minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
        # Le gate du corpus d'or sécurité (zéro faux négatif allergène/régime)
        # tourne dans `npm run test` (Epic 4) : un faux négatif fait échouer le CI.
